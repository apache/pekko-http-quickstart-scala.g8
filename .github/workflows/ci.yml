name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    if: github.repository == 'apache/pekko-http-quickstart-scala.g8'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13

      - name: Cache Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: sbt & Paradox
        run: sbt test docs/paradox

      - name: generate and test, Scala 2.13
        run: |-
          export SBT_VERSION=1.12.14
          sbt -Dsbt.version=$SBT_VERSION new file://$PWD --name=hello-world --scala_version=2.13.18 --force
          cd hello-world
          sbt -Dsbt.version=$SBT_VERSION test
