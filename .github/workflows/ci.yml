name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    if: github.repository == 'apache/pekko-http-quickstart-scala.g8'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7

      - name: Cache Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1

      - name: sbt & Paradox
        run: sbt test docs/paradox

      - name: generate and test, Scala 2.13
        run: |-
          export SBT_VERSION=1.12.14
          sbt -Dsbt.version=$SBT_VERSION new file://$PWD --name=hello-world --scala_version=2.13.18 --force
          cd hello-world
          sbt -Dsbt.version=$SBT_VERSION test
