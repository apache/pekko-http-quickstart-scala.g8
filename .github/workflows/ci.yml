name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    if: github.repository == 'apache/pekko-http-quickstart-scala.g8'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Cache Coursier cache
        uses: coursier/cache-action@057d08c2f9a2c4e7a4d33df3aae657b7db88b8cc # v8.2.0

      - name: sbt & Paradox
        run: sbt test docs/paradox

      - name: generate and test, Scala 2.13
        run: |-
          export SBT_VERSION=1.12.14
          sbt -Dsbt.version=$SBT_VERSION new file://$PWD --name=hello-world --scala_version=2.13.18 --force
          cd hello-world
          sbt -Dsbt.version=$SBT_VERSION test
